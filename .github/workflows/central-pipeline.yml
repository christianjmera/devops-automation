name: Central DevOps Pipeline

on:
  repository_dispatch:
    types:
      - application_push

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.branch }}
  cancel-in-progress: false

jobs:
  validate-event:
    name: Validate event and resolve environment
    runs-on: ubuntu-latest

    outputs:
      source_repository: ${{ steps.validate.outputs.source_repository }}
      source_branch: ${{ steps.validate.outputs.source_branch }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      target_environment: ${{ steps.validate.outputs.target_environment }}
      delivery_id: ${{ steps.validate.outputs.delivery_id }}

    steps:
      - name: Validate dispatch payload
        id: validate
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_BRANCH: ${{ github.event.client_payload.branch }}
          SOURCE_REF: ${{ github.event.client_payload.ref }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
          DELIVERY_ID: ${{ github.event.client_payload.delivery_id }}
          SENDER: ${{ github.event.client_payload.sender }}
          ALLOWED_SOURCE_REPOSITORIES: ${{ vars.ALLOWED_SOURCE_REPOSITORIES }}

        run: |
          set -euo pipefail

          echo "Validating incoming application event..."

          if [[ -z "$SOURCE_REPOSITORY" ]]; then
            echo "ERROR: Missing source repository"
            exit 1
          fi

          if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid repository format"
            exit 1
          fi

          if [[ -z "$ALLOWED_SOURCE_REPOSITORIES" ]]; then
            echo "ERROR: ALLOWED_SOURCE_REPOSITORIES is not configured"
            exit 1
          fi

          REPOSITORY_AUTHORIZED=false
          IFS=',' read -ra ALLOWED_REPOSITORIES <<< "$ALLOWED_SOURCE_REPOSITORIES"

          for allowed_repository in "${ALLOWED_REPOSITORIES[@]}"; do
            allowed_repository="$(echo "$allowed_repository" | xargs)"

            if [[ "${allowed_repository,,}" == "${SOURCE_REPOSITORY,,}" ]]; then
              REPOSITORY_AUTHORIZED=true
              break
            fi
          done

          if [[ "$REPOSITORY_AUTHORIZED" != "true" ]]; then
            echo "ERROR: Repository is not authorized"
            exit 1
          fi

          case "$SOURCE_BRANCH" in
            develop) TARGET_ENVIRONMENT="DEV" ;;
            qa) TARGET_ENVIRONMENT="TEST" ;;
            uat) TARGET_ENVIRONMENT="UAT" ;;
            prod) TARGET_ENVIRONMENT="PROD" ;;
            *)
              echo "ERROR: Unsupported branch"
              exit 1
              ;;
          esac

          if [[ "$SOURCE_REF" != "refs/heads/$SOURCE_BRANCH" ]]; then
            echo "ERROR: Branch and Git reference do not match"
            exit 1
          fi

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA"
            exit 1
          fi

          if [[ ! "$DELIVERY_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "ERROR: Invalid delivery ID"
            exit 1
          fi

          {
            echo "source_repository=$SOURCE_REPOSITORY"
            echo "source_branch=$SOURCE_BRANCH"
            echo "commit_sha=$COMMIT_SHA"
            echo "target_environment=$TARGET_ENVIRONMENT"
            echo "delivery_id=$DELIVERY_ID"
          } >> "$GITHUB_OUTPUT"

          echo "Event validated successfully"
          echo "Source repository: $SOURCE_REPOSITORY"
          echo "Source branch: $SOURCE_BRANCH"
          echo "Target environment: $TARGET_ENVIRONMENT"
          echo "Commit: $COMMIT_SHA"
          echo "Sender: $SENDER"

      - name: Display pipeline context
        env:
          SOURCE_REPOSITORY: ${{ steps.validate.outputs.source_repository }}
          SOURCE_BRANCH: ${{ steps.validate.outputs.source_branch }}
          TARGET_ENVIRONMENT: ${{ steps.validate.outputs.target_environment }}
          COMMIT_SHA: ${{ steps.validate.outputs.commit_sha }}
        run: |
          echo "======================================"
          echo " CENTRAL PIPELINE CONTEXT"
          echo "======================================"
          echo "Repository: $SOURCE_REPOSITORY"
          echo "Branch: $SOURCE_BRANCH"
          echo "Environment: $TARGET_ENVIRONMENT"
          echo "Commit: $COMMIT_SHA"
          echo "======================================"

  checkout-source:
    name: Generate token and checkout application
    needs: validate-event
    runs-on: ubuntu-latest

    steps:
      - name: Generate temporary GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: christianjmera
          repositories: devops-java-demo
          permission-contents: read

      - name: Checkout application source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-event.outputs.source_repository }}
          ref: ${{ needs.validate-event.outputs.commit_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: application-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify downloaded commit
        working-directory: application-source
        env:
          EXPECTED_COMMIT: ${{ needs.validate-event.outputs.commit_sha }}
        run: |
          set -euo pipefail

          # Comparar el commit descargado con el commit recibido en el evento.
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if [[ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "ERROR: Downloaded commit does not match event"
            exit 1
          fi

          echo "Application source downloaded successfully"
          echo "Verified commit: $ACTUAL_COMMIT"

          # Mostrar la estructura inicial del proyecto.
          echo "Application files:"
          ls -la
